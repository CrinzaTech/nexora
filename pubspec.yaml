name: nexora
description: "A new Flutter project."
publish_to: "none"
version: 0.0.5+5

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────────
  dartz: ^0.10.1
  flutter_bloc: ^8.1.6
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # ── Dependency injection ─────────────────────────────────────────
  get_it: ^7.6.4

  # ── Routing ──────────────────────────────────────────────────────
  go_router: ^14.6.2

  # ── Networking ───────────────────────────────────────────────────
  dio: ^5.0.0
  http: ^1.6.0
  retrofit: ^4.0.0
  # Real-time chat — SignalR client (ASP.NET Core hub). Used by the
  # chat-room screen to receive ReceiveMessage / MessageDeleted /
  # typing events and to invoke SendMessage / JoinGroup / LeaveGroup.
  signalr_netcore: ^1.4.4
  # Live-class real-time audio (raise-hand → speak). Audio-only publish;
  # students never publish video. WebRTC native stack (min Android SDK 23).
  # ≥2.5.0+hotfix.1 required for Android 16 KB page-size support (ships a
  # 16 KB-aligned fork of the noise FFT lib; older versions bundle a 4 KB
  # libnoise.so that Play rejects for Android 15+ targets). Resolves to
  # 2.6.4 on Flutter 3.35.x (2.6.5+ needs meta ^1.17 → a newer Flutter);
  # a future Flutter upgrade will pull newer versions automatically.
  livekit_client: ^2.6.4
  # Native audio-session knobs (Android audio focus / mode, iOS
  # AVAudioSession category). Pulled in transitively by livekit_client;
  # declared directly because the live class must keep the HLS video
  # playing while the student's mic is open — that needs an explicit
  # focus/category configuration, not the WebRTC defaults.
  flutter_webrtc: ^1.3.0
  # Runtime mic permission — requested only at the moment a student is
  # about to speak (never camera).
  permission_handler: ^11.3.0
  # Keep the screen awake during a live class so it doesn't dim/lock
  # mid-session.
  wakelock_plus: ^1.2.5
  # Background audio + automatic audio-only fallback for live classes.
  # just_audio plays the audio-only HLS rendition; audio_service keeps it
  # alive in the background with lock-screen / notification controls.
  # connectivity_plus biases the fallback/recovery decisions.
  just_audio: ^0.9.40
  audio_service: ^0.18.15
  connectivity_plus: ^7.0.0

  # ── Firebase ─────────────────────────────────────────────────────
  firebase_core: ^4.6.0
  firebase_crashlytics: ^5.0.4
  firebase_messaging: ^16.0.4

  # ── Authentication / session ─────────────────────────────────────
  # flutter_secure_storage: auth token via platform keystore/keychain.
  flutter_secure_storage: ^9.2.2

  # ── Payments ─────────────────────────────────────────────────────
  razorpay_flutter: ^1.3.6

  # ── Notifications ────────────────────────────────────────────────
  # flutter_local_notifications: in-app / scheduled alerts. iOS remote
  # push is gated on a paid Apple Developer account; until then every
  # alert is delivered through this plugin.
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # ── Media & file handling ────────────────────────────────────────
  cached_network_image: ^3.4.1
  # Live-class HLS player. Exposes ExoPlayer/AVPlayer buffer tuning
  # (BetterPlayerBufferingConfiguration — video_player/chewie exposed
  # none) and a runtime setMixWithOthers() so the stream keeps playing
  # (ducked, not paused) while the WebRTC/LiveKit mic session owns
  # audio focus during raise-hand → speak.
  better_player_plus: ^1.0.8
  # file_picker: assignment submissions (PDFs / images).
  file_picker: ^8.1.4
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  syncfusion_flutter_core: ^33.1.47
  syncfusion_flutter_pdfviewer: ^33.1.47
  video_player: ^2.10.1
  # Non-YouTube lecture playback only — network MP4/HLS and rewritten
  # Google Drive links, via `PlayVideoFrom.network(...)`. YouTube nodes
  # no longer go through here: `PlayVideoFrom.youtube(...)` /
  # `PodPlayerController.getYoutubeUrls(...)` resolve raw stream URLs
  # with `youtube_explode_dart` and play them outside YouTube's player,
  # which strips ads and branding and breaches the YouTube API Services
  # Terms. Those go through `youtube_player_flutter` below instead.
  pod_player: ^0.2.2
  # YouTube lecture playback through the **official IFrame Player API**
  # (no scraping, no Google Cloud API key, no quota — the IFrame API is
  # unmetered and video is served from YouTube's CDN). Wrapped by
  # `CustomYoutubePlayer`, which adds ±10s skip, a caption on/off
  # toggle and a subtitle-language picker that survive landscape
  # fullscreen. Pulls in `flutter_inappwebview` transitively (minSdk 19+;
  # ours is well above). See PLAYER_INTEGRATION.md.
  youtube_player_flutter: ^9.1.1

  # ── UI components ────────────────────────────────────────────────
  argon_buttons_flutter_fix: ^1.1.3
  auto_size_text: ^3.0.0
  marquee: ^2.2.3
  awesome_snackbar_content: ^0.1.8
  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.7.4+1
  flutter_native_splash: ^2.4.7
  flutter_spinkit: ^5.2.2
  pinput: ^2.2.21
  readmore: ^3.0.0
  shimmer: ^3.0.0

  # ── Typography ───────────────────────────────────────────────────
  google_fonts: ^6.2.1

  # ── Utilities ────────────────────────────────────────────────────
  flutter_dotenv: ^5.1.0
  intl: ^0.20.2
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.1
  # Native share sheet (WhatsApp, Messages, Mail, …) for "Share App".
  share_plus: ^12.0.0
  # Renders the exam question/instruction HTML (<p>, <ul><li>, <b>, …).
  # Lightweight, no WebView. Images inside HTML are unsupported (v1 scope).
  flutter_widget_from_html_core: ^0.15.2
  # OTP auto-detection — uses Android SMS User Consent API (no READ_SMS
  # permission) and iOS OneTimeCode autofill hint. Falls back silently
  # on devices with no SIM / SMS capability.
  sms_autofill: ^2.4.0

  # ── Security ─────────────────────────────────────────────────────
  # iOS jailbreak / Android root detection. We use this only on iOS
  # (the closest analogue to Android's "developer options" toggle that
  # we check natively in MainActivity). Cross-platform support is a
  # bonus but the Android dev-mode signal is authoritative for us.
  flutter_jailbreak_detection: ^1.10.0
  webview_flutter: 4.13.1
  device_info_plus: ^12.4.0
  android_id: ^0.4.0        # SSAID — stable across reinstalls/reboots/OTAs
  # math_expressions: exam calculator arithmetic (parsing, precedence, sci functions).
  math_expressions: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code generation ──────────────────────────────────────────────
  build_runner: ^2.4.13
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  # retrofit_generator excluded: SDK incompatibility; api_client.g.dart
  # is maintained manually.
  # retrofit_generator: ^7.0.0

  # ── App icon / splash generation ─────────────────────────────────
  flutter_launcher_icons: ^0.14.1

  # ── Linting ──────────────────────────────────────────────────────
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/person/
    - assets/images/backgrounds/

    - assets/icons/
    - assets/icons/navbar/

    - assets/fonts/
    - assets/animations/

# App launcher icon — generated by `flutter pub run flutter_launcher_icons`.
# Source PNG is the brand-driven logo from BrandingConfig (currently the
# red-eye Crinesta mark on this branch). adaptive_icon_background is plain
# white so the Android 12+ adaptive-icon mask doesn't show a coloured ring
# behind the glyph.
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/logo.png"

# Splash Screen Configuration
flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  android_12:
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
